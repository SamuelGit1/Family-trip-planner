<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Trip Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Screen 1: Setup -->
    <section id="screen-setup" class="screen active">
      <h1>🛫 Family Trip Planner</h1>
      <div id="mode-selector">
        <label class="mode-card">
          <input type="radio" name="mode" value="kaohsiung" checked>
          <span>🏙️ Kaohsiung<br><small>Pre-loaded activities</small></span>
        </label>
        <label class="mode-card">
          <input type="radio" name="mode" value="ai">
          <span>🤖 AI Powered<br><small>LLM-generated activities</small></span>
        </label>
        <label class="mode-card">
          <input type="radio" name="mode" value="global">
          <span>🌍 Global Search<br><small>Any city in the world</small></span>
        </label>
      </div>
      <div id="mode-extra-inputs"></div>
      <div id="trip-duration" style="margin:12px 0;">
        <label for="input-days" style="font-size:14px;font-weight:600;">📅 Trip Length</label>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
          <input type="range" id="input-days" min="2" max="14" value="7" step="1" style="flex:1;">
          <span id="days-label" style="font-weight:700;font-size:18px;min-width:48px;text-align:center;">7 days</span>
        </div>
      </div>
      <div id="persona-cards"></div>
      <button id="btn-add-persona" class="btn-secondary" style="margin-top:8px;">+ Add Traveler</button>
      <button id="btn-start" class="btn-primary">Start Swiping →</button>
    </section>

    <!-- Persona Editor Modal (overlay) -->
    <div id="persona-editor-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;justify-content:center;align-items:center;">
      <div id="persona-editor" style="background:white;border-radius:16px;padding:24px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto;">
        <h3 id="persona-editor-title">Edit Traveler</h3>
        <input type="hidden" id="pe-id">
        <label style="font-size:13px;">Name</label>
        <input type="text" id="pe-name" style="width:100%;padding:10px;border:2px solid #ddd;border-radius:10px;margin:4px 0 10px;font-size:14px;">
        <label style="font-size:13px;">Emoji</label>
        <input type="text" id="pe-emoji" maxlength="2" style="width:100%;padding:10px;border:2px solid #ddd;border-radius:10px;margin:4px 0 10px;font-size:20px;text-align:center;">
        <label style="font-size:13px;">Color</label>
        <input type="color" id="pe-color" style="width:100%;height:40px;border:2px solid #ddd;border-radius:10px;margin:4px 0 10px;cursor:pointer;">
        <label style="font-size:13px;">Walking Tolerance</label>
        <select id="pe-walking" style="width:100%;padding:10px;border:2px solid #ddd;border-radius:10px;margin:4px 0 10px;font-size:14px;">
          <option value="low">Low — slow pace, minimal walking</option>
          <option value="medium">Medium — moderate walking OK</option>
          <option value="high">High — lots of walking fine</option>
        </select>
        <label style="font-size:13px;">Max Duration per Activity</label>
        <select id="pe-duration" style="width:100%;padding:10px;border:2px solid #ddd;border-radius:10px;margin:4px 0 10px;font-size:14px;">
          <option value="1h">1 hour</option>
          <option value="2h">2 hours</option>
          <option value="half-day">Half day</option>
          <option value="full-day">Full day</option>
        </select>
        <label style="font-size:13px;display:flex;align-items:center;gap:8px;margin:8px 0;">
          <input type="checkbox" id="pe-rest" style="width:18px;height:18px;"> Requires rest spots
        </label>
        <label style="font-size:13px;margin-top:8px;display:block;">Interest Tags (check what they enjoy)</label>
        <div id="pe-tags" style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px;"></div>
        <div style="display:flex;gap:8px;">
          <button id="btn-pe-save" class="btn-primary" style="margin-top:0;">Save</button>
          <button id="btn-pe-cancel" class="btn-secondary" style="margin-top:0;">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Screen 2: Swipe -->
    <section id="screen-swipe" class="screen">
      <div class="swipe-header">
        <span id="swipe-progress"></span>
        <button id="btn-done-swiping" class="btn-secondary">Done Swiping ✓</button>
      </div>
      <div id="card-stack"></div>
      <div class="swipe-actions">
        <button id="btn-pass" class="btn-swipe btn-pass">❌</button>
        <button id="btn-like" class="btn-swipe btn-like">❤️</button>
      </div>
      <div id="persona-tabs"></div>
    </section>

    <!-- Screen 3: Match Board -->
    <section id="screen-match" class="screen">
      <h2>🎯 Match Board</h2>
      <div id="everyone-zone"></div>
      <div id="overlap-strips"></div>
      <div id="conflict-zone"></div>
      <div class="match-actions">
        <button id="btn-compromise" class="btn-secondary">Suggest Compromises 🔄</button>
        <button id="btn-build-itinerary" class="btn-primary">Build Itinerary →</button>
        <button id="btn-back-to-swiping" class="btn-back">← Back to Swiping</button>
      </div>
    </section>

    <!-- Screen 4: Itinerary Builder -->
    <section id="screen-itinerary" class="screen">
      <h2 id="itinerary-title">📅 7-Day Itinerary</h2>
      <div id="day-columns"></div>
      <div id="family-happiness"></div>
      <button id="btn-share" class="btn-primary">Share Itinerary →</button>
    </section>

    <!-- Screen 5: Share -->
    <section id="screen-share" class="screen">
      <h2>📋 Your Itinerary</h2>
      <pre id="share-text"></pre>
      <button id="btn-copy" class="btn-primary">📋 Copy to Clipboard</button>
      <button id="btn-restart" class="btn-secondary">🔄 Start Over</button>
    </section>
  </div>

  <script src="engine/activities.js"></script>
  <script src="engine/tagMatcher.js"></script>
  <script src="engine/geocoder.js"></script>
  <script src="engine/itinerary.js"></script>
  <script src="engine/searchFetcher.js"></script>
  <script src="main.js"></script>
</body>
</html>
